<!doctype html><title>paintbench</title>
<!-- Mal-Benchmark fuer Skia: Verlaeufe, Transparenz, Schatten, runde Ecken,
     skalierte Bilder, Text. Laufen lassen mit
       BL_DEBUG=1 node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/paintbench.html /tmp/p.ppm 1280 2000
     Das Skript malt die Seite mehrmals neu und gibt "BENCH paint=ms" aus. -->
<style>
body { margin: 0; font: 14px sans-serif; background: linear-gradient(135deg, #fde, #def); }
.grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
.box { width: 150px; height: 90px; border-radius: 14px; box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
  background: linear-gradient(to right, rgba(255, 80, 0, .7), rgba(0, 120, 255, .6)); color: white; padding: 6px; }
.box:nth-child(3n) { background: radial-gradient(circle, #ff0a, #0f08); opacity: .85; }
.box:nth-child(4n) { transform: rotate(4deg); border: 3px solid rgba(0, 0, 0, .3); }
img { width: 150px; height: 90px; border-radius: 8px; opacity: .9; }
</style>
<div class="grid" id="grid"></div>
<script>
const grid = document.getElementById('grid');
// Kleines Bild (64x64 Canvas) als data:-URL, wird auf 150x90 skaliert
const c = document.createElement('canvas');
c.width = c.height = 64;
const g = c.getContext('2d');
for (let y = 0; y < 64; y += 8) {
  for (let x = 0; x < 64; x += 8) {
    g.fillStyle = `hsl(${(x + y) * 3}, 80%, 55%)`;
    g.fillRect(x, y, 8, 8);
  }
}
const src = c.toDataURL();
for (let i = 0; i < 160; i++) {
  if (i % 5 === 4) {
    const img = document.createElement('img');
    img.src = src;
    grid.appendChild(img);
  } else {
    const d = document.createElement('div');
    d.className = 'box';
    d.textContent = 'Kasten ' + i + ' mit etwas Text, der umbricht';
    grid.appendChild(d);
  }
}
// Nach dem ersten Bild: mehrmals alles neu malen lassen (Farbe wechseln)
setTimeout(() => {
  let n = 0, best = 1e9, start = 0;
  const step = () => {
    if (n > 0)
      best = Math.min(best, performance.now() - start);
    if (n === 6) {
      console.log('BENCH paint=' + best.toFixed(0));
      return;
    }
    n++;
    document.body.style.color = n % 2 ? '#111' : '#222';
    grid.style.outline = n % 2 ? '1px solid red' : '1px solid blue';
    start = performance.now();
    requestAnimationFrame(() => requestAnimationFrame(step));
  };
  step();
}, 500);
</script>
