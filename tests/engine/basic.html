<!DOCTYPE html>
<html>
<head>
<style>

  .box { position: absolute; left: 40px; top: 40px; width: 200px; height: 100px; background: rgb(255, 0, 0); }
  .round { position: absolute; left: 300px; top: 40px; width: 100px; height: 100px; border-radius: 50%; background: rgb(0, 0, 255); }

</style>
</head>
<body>
  <div class="box"></div>
  <div class="round"></div>
  <h1 id="title">Hello browser-lite</h1>
  <script>
    document.getElementById('title').textContent += ' (JS ok)';
    console.log('script ran');
  </script>
</body>
</html>
