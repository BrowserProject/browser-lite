  const style = document.createElement('style');
  style.textContent = text;
  document.head.appendChild(style);
  const ok = style.sheet.cssRules.length > 0;
  style.remove();
  return ok;
};

  'async:image-bitmap-from-canvas': async () => (await createImageBitmap(document.createElement('canvas'))).width === 300,
  'async:font-loading': async () => { await document.fonts.ready; return true; },
  'async:indexeddb-open': () => new Promise((resolve) => {
    const request = indexedDB.open('features-test');
    request.onsuccess = () => { request.result.close(); resolve(true); };
    request.onerror = () => resolve(false);
  }),
  'async:cache-open': async () => !!(await caches.open('features-test')),
  'async:storage-estimate': async () => typeof (await navigator.storage.estimate()).quota === 'number',
  'async:opfs-directory': async () => !!(await navigator.storage.getDirectory()),
  'async:permissions-query': async () => typeof (await navigator.permissions.query({ name: 'geolocation' })).state === 'string',
  'async:wasm-instantiate': async () => !!(await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]))),
  'async:worker-roundtrip': () => new Promise((resolve) => {
