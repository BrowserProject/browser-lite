<!doctype html><title>hang</title><body><script>
// Endless loops: the engine's watchdog (engine/src/EngineLoop.cpp) terminates
// each one, also a second one, and the page's try/catch/finally see nothing of
// it. Afterwards timers, promises and new scripts keep running.
//   BL_SCRIPT_TIMEOUT=2 RENDER_WAIT_FOR="HANG done" node tests/engine/render.mjs build/webcore/bin tests/engine/pages/hang.html /tmp/h.ppm 200 200
// At the end "HANG done=ok", otherwise "HANG done=<reason>".
const start = Date.now();
const state = { spins: 0, caught: false, finished: false, second: 0 };
setTimeout(() => {
  try {
    for (;;)
      state.spins++;
  } catch (e) {
    state.caught = true;
  } finally {
    state.finished = true;
  }
}, 0);
// Was already due while the loop ran
setTimeout(() => {
  const first = Date.now() - start;
  console.log(`HANG first loop terminated after ${first} ms, ${state.spins} rounds`);
  setTimeout(() => {
    for (;;)
      state.second++;
  }, 0);
  setTimeout(async () => {
    const value = await Promise.resolve(42);
    const evaluated = new Function('return 6 * 7')();
    const problems = [];
    if (!state.spins || !state.second)
      problems.push('loop-did-not-run');
    if (state.caught || state.finished)
      problems.push('termination-caught');
    if (first < 1000)
      problems.push('too-early');
    if (value !== 42 || evaluated !== 42)
      problems.push('broken-afterwards');
    console.log('HANG done=' + (problems.join(',') || 'ok'));
  }, 10);
}, 10);
</script>
