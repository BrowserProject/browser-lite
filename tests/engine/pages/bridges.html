<!doctype html><title>bridges</title><body><script>
// Engine features (BL_FEATURES) and the host bridges: no __bl* global is ever visible to page
// scripts (main frame, iframe, initial empty document), and a disabled feature looks like a
// browser without it. The expectations come from the query of the page URL:
//   BL_FEATURES= RENDER_URL="file:///test/?features=none" RENDER_WAIT_FOR="BRIDGES done" node tests/engine/render.mjs build/webcore/bin tests/engine/pages/bridges.html /tmp/b.ppm 200 200
//   RENDER_URL="file:///test/?features=all" RENDER_WAIT_FOR="BRIDGES done" node tests/engine/render.mjs ...
// At the end "BRIDGES done=ok", otherwise "BRIDGES done=<failed checks>".
const all = new URLSearchParams(location.search).get('features') !== 'none';
const failed = [];
const expect = (name, ok) => {
  console.log('BRIDGES ' + name + '=' + (ok ? 'ok' : 'FAILED'));
  if (!ok)
    failed.push(name);
};
const bridgeGlobals = (win) => Object.getOwnPropertyNames(win).filter((name) => name.startsWith('__bl'));

(async () => {
  expect('main frame without __bl globals', bridgeGlobals(window).length === 0);
  // Initial empty document of an iframe that is still loading
  const loading = document.createElement('iframe');
  loading.src = 'data:text/html,<p>later</p>';
  document.body.append(loading);
  expect('initial empty document without __bl globals', bridgeGlobals(loading.contentWindow).length === 0);
  const blank = document.createElement('iframe');
  document.body.append(blank);
  expect('about:blank iframe without __bl globals', bridgeGlobals(blank.contentWindow).length === 0);
  // The polyfills reach these documents too (or stay away without the feature)
  expect('EyeDropper in the initial empty document ' + (all ? 'present' : 'missing'), (typeof loading.contentWindow.EyeDropper === 'function') === all);
  expect('EyeDropper in the about:blank iframe ' + (all ? 'present' : 'missing'), (typeof blank.contentWindow.EyeDropper === 'function') === all);
  const srcdoc = document.createElement('iframe');
  srcdoc.srcdoc = '<script>parent.postMessage(Object.getOwnPropertyNames(window).filter((n) => n.startsWith("__bl")).join(","), "*")<\/script>';
  const fromFrame = new Promise((resolve) => addEventListener('message', (event) => resolve(event.data), { once: true }));
  document.body.append(srcdoc);
  expect('srcdoc iframe without __bl globals', await fromFrame === '');

  expect('AudioContext ' + (all ? 'present' : 'missing'), (typeof AudioContext === 'function') === all);
  expect('RTCPeerConnection ' + (all ? 'present' : 'missing'), (typeof RTCPeerConnection === 'function') === all);
  expect('getBattery ' + (all ? 'present' : 'missing'), (typeof navigator.getBattery === 'function') === all);
  expect('EyeDropper ' + (all ? 'present' : 'missing'), (typeof EyeDropper === 'function') === all);
  expect('showOpenFilePicker ' + (all ? 'present' : 'missing'), (typeof showOpenFilePicker === 'function') === all);
  expect('speechSynthesis ' + (all ? 'present' : 'missing'), ('speechSynthesis' in window) === all);
  expect('navigator.connection ' + (all ? 'present' : 'missing'), ('connection' in navigator) === all);
  expect('navigator.clipboard ' + (all ? 'present' : 'missing'), ('clipboard' in navigator) === all);
  expect('requestPictureInPicture ' + (all ? 'present' : 'missing'), (typeof document.createElement('video').requestPictureInPicture === 'function') === all);
  // srcObject streams play without the media feature (they need no host <video>)
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 16;
  canvas.getContext('2d').fillRect(0, 0, 16, 16);
  const video = document.createElement('video');
  video.muted = true;
  video.srcObject = canvas.captureStream();
  const metadata = await new Promise((resolve) => {
    video.onloadedmetadata = () => resolve(video.readyState);
    video.onerror = () => resolve('error ' + video.error?.code);
    setTimeout(() => resolve('timeout ' + video.readyState), 10000);
  });
  expect('canvas.captureStream() in video.srcObject reaches readyState >= 1', metadata >= 1);
  if (!all) {
    expect('canPlayType without media', document.createElement('video').canPlayType('video/mp4') === '');
    expect('MediaSource.isTypeSupported without media', !globalThis.MediaSource || !MediaSource.isTypeSupported('video/webm; codecs="vp8"'));
    const file = document.createElement('video');
    const fileState = await new Promise((resolve) => {
      file.onerror = () => resolve(file.error?.code);
      file.onloadedmetadata = () => resolve('loaded');
      setTimeout(() => resolve('timeout'), 10000);
      file.src = 'data:video/mp4;base64,AAAA';
    });
    expect('a media file does not load without media', fileState === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED);
    let capture = 'resolved';
    try {
      await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e) {
      capture = e.name;
    }
    expect('getUserMedia rejects with NotAllowedError', capture === 'NotAllowedError');
    const geolocation = await new Promise((resolve) => navigator.geolocation.getCurrentPosition(() => resolve('position'), (e) => resolve(e.code)));
    expect('geolocation denied', geolocation === 1);
    expect('notifications denied', (await navigator.permissions.query({ name: 'notifications' })).state === 'denied');
  }
  console.log('BRIDGES done=' + (failed.join(',') || 'ok'));
})();
</script>
