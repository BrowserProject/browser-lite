<!doctype html>
<meta charset="utf-8">
<title>GC stress test</title>
<div id="root"></div>
<script>
// Lots of garbage spread over many tasks, the GC runs in between (in the
// engine only between two tasks). What is kept has to stay intact: JS objects,
// strings, maps, closures and DOM nodes with extra properties.
const ROUNDS = 60;
const kept = [];
const root = document.getElementById('root');
let round = 0;

function makeGraph(seed) {
  const objects = [];
  for (let i = 0; i < 300; i++) {
    const object = { id: seed * 1000 + i, name: 'obj-' + seed + '-' + i, list: [i, i * 2, i * 3] };
    object.self = object;
    object.map = new Map([[i, 'value-' + i]]);
    object.get = () => object.id * 2;
    objects.push(object);
  }
  const element = document.createElement('span');
  element.expando = { seed, objects };
  element.textContent = 'round ' + seed;
  root.appendChild(element);
  if (root.childNodes.length > 20)
    root.removeChild(root.firstChild); // DOM nodes become garbage
  return { seed, objects, element, text: JSON.stringify(objects.slice(0, 5).map((o) => o.name)) };
}

function check(entry) {
  const { seed, objects, element, text } = entry;
  if (objects.length !== 300)
    return 'length ' + objects.length;
  for (let i = 0; i < objects.length; i++) {
    const object = objects[i];
    if (object.id !== seed * 1000 + i || object.self !== object || object.name !== 'obj-' + seed + '-' + i)
      return 'object ' + i;
    if (object.list[2] !== i * 3 || object.map.get(i) !== 'value-' + i || object.get() !== object.id * 2)
      return 'content ' + i;
  }
  if (element.expando.seed !== seed || element.expando.objects !== objects || element.textContent !== 'round ' + seed)
    return 'DOM node';
  if (JSON.stringify(objects.slice(0, 5).map((o) => o.name)) !== text)
    return 'String';
  return null;
}

function step() {
  // Garbage: about 5 MB per round
  let garbage = [];
  for (let i = 0; i < 20000; i++)
    garbage.push({ a: i, b: 'garbage' + i, c: [i] });
  garbage = null;

  kept.push(makeGraph(round));
  if (kept.length > 25)
    kept.shift();
  for (const entry of kept) {
    const error = check(entry);
    if (error) {
      console.log('GC-TEST ERROR round ' + round + ' entry ' + entry.seed + ': ' + error);
      return;
    }
  }
  round++;
  if (round < ROUNDS)
    setTimeout(step, 0);
  else
    console.log('GC-TEST ok ' + ROUNDS + ' rounds');
}
setTimeout(step, 0);
</script>
