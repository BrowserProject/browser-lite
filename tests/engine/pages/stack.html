<!doctype html><title>stack</title><body><script>
// Stack limit of the interpreter after a VM trap (patch 0022): the GC at safe
// points sets a trap bit, afterwards the limit has to be the one of the JS
// stack again. Before, deep recursion afterwards ran past the end of the JS
// stack and overwrote foreign memory (crash on x.com).
//   RENDER_WAIT_FOR="STACK done" node tests/engine/render.mjs build/webcore/bin tests/engine/pages/stack.html /tmp/s.ppm 200 200
// At the end "STACK done=ok".
function depth() {
  let n = 0;
  function f() { n++; f(); }
  try {
    f();
  } catch (e) {
    return [n, e instanceof RangeError];
  }
  return [n, false];
}

let ok = true;
const [first, firstIsRange] = depth();
console.log(`STACK start depth=${first} range=${firstIsRange}`);
if (!firstIsRange)
  ok = false;
for (let round = 0; round < 5; round++) {
  // Lots of garbage: the heap wants to collect while the engine defers the GC
  let keep = [];
  for (let i = 0; i < 300000; i++)
    keep.push({ i, s: 'x' + i });
  keep = null;
  const [n, isRange] = depth();
  console.log(`STACK round=${round} depth=${n} range=${isRange}`);
  if (!isRange || n > first * 1.5 || n < first / 2)
    ok = false;
}
// Something else that touches a lot of memory: broken memory shows here
const big = Array.from({ length: 100000 }, (_, i) => ({ i, t: [i, i + 1] }));
if (big.reduce((sum, o) => sum + o.t[1] - o.i, 0) !== 100000)
  ok = false;
console.log('STACK done=' + (ok ? 'ok' : 'ERROR'));
</script>
