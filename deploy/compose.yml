# browser-lite auf dem Server. Der Deploy-Workflow setzt IMAGE (immer per Digest).
# Ohne RELAY_TOKEN sind Relay und Profil offen, darum nur intern (siehe deploy/README.md).
services:
  browser-lite:
    image: ${IMAGE:?IMAGE fehlt}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    # Namen, unter denen das Profil antwortet (Standard: tailscale serve)
    environment:
      PROFILE_HOSTS: ${PROFILE_HOSTS:-.ts.net}
    read_only: true
    volumes:
      - profile:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local

volumes:
  profile:
