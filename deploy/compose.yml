# browser-lite auf dem Server. Der Deploy-Workflow setzt IMAGE (immer per Digest).
# Ohne RELAY_TOKEN ist das Relay offen, darum nur intern (siehe deploy/README.md).
services:
  browser-lite:
    image: ${IMAGE:?IMAGE fehlt}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
