# browser-lite on the server: the demo behind Caddy (HTTPS with Let's Encrypt, HTTP/3). The deploy
# (deploy-shell.sh) sets IMAGE (always by digest) and CADDY_IMAGE (versions.env); DOMAIN and
# RELAY_TOKEN come from server.env on the server, never from the repository.
services:
  browser-lite:
    image: ${IMAGE:?IMAGE missing}
    restart: unless-stopped
    # No port on the host: only Caddy reaches it, so X-Forwarded-For can be trusted
    expose: ["8080"]
    environment:
      ALLOWED_HOSTS: ${DOMAIN:?DOMAIN missing}
      RELAY_TOKEN: ${RELAY_TOKEN:?RELAY_TOKEN missing}
      RELAY_TRUST_PROXY: "1"
    read_only: true
    volumes:
      - profile:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE missing}
    restart: unless-stopped
    depends_on: [browser-lite]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local

volumes:
  profile:
  caddy-data:
  caddy-config:
