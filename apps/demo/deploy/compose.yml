# browser-lite on the server. The deploy workflow sets IMAGE (always by digest).
# Without RELAY_TOKEN relay and profile are open, so internal use only (see README.md).
services:
  browser-lite:
    image: ${IMAGE:?IMAGE missing}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Names the profile answers under (default: tailscale serve)
      PROFILE_HOSTS: ${PROFILE_HOSTS:-.ts.net}
    read_only: true
    volumes:
      - profile:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local

volumes:
  profile:
