<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>browser-lite</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header id="chrome">
    <div id="tabs">
      <div id="tab-list" role="tablist" aria-label="Tabs"></div>
      <button type="button" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab" data-icon="plus"></button>
    </div>
    <div id="toolbar">
      <button type="button" id="back" title="Back" aria-label="Back" disabled data-icon="back"></button>
      <button type="button" id="forward" title="Forward" aria-label="Forward" disabled data-icon="forward"></button>
      <button type="button" id="reload" title="Reload" aria-label="Reload" data-icon="reload"></button>
      <form id="address-form">
        <span id="security" hidden></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="go" placeholder="Search or enter address" aria-label="Address and search bar">
        <button type="button" id="bookmark" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page" disabled data-icon="star"></button>
      </form>
      <span id="status"></span>
      <button type="button" id="zoom" title="Reset zoom" hidden></button>
      <button type="button" id="tab-count" title="Tabs" aria-label="Tabs"><span>0</span></button>
      <span id="extension-buttons"></span>
      <button type="button" id="menu-button" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" data-icon="menu"></button>
    </div>
    <div id="profile-notice" role="alert" hidden><span></span><button type="button">Reload</button></div>
    <div id="progress"></div>
  </header>
  <main id="viewport">
    <!-- The views go into #pages, which a page in fullscreen takes: messages and find bar too -->
    <div id="pages">
      <div id="boot" role="status"><div class="boot-card"><p class="title">Loading engine...</p></div></div>
      <section id="new-tab-page" aria-label="New tab" hidden>
        <h1 class="ntp-greeting">New tab</h1>
        <button type="button" class="ntp-search" data-icon="search">Search or enter address</button>
        <nav class="ntp-tiles" aria-label="Frequent sites" hidden></nav>
      </section>
      <div id="find-bar" hidden>
        <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page" aria-label="Find in page">
        <span id="find-count"></span>
        <button type="button" id="find-prev" title="Previous match (Shift+Enter)" aria-label="Previous match" data-icon="chevron-up"></button>
        <button type="button" id="find-next" title="Next match (Enter)" aria-label="Next match" data-icon="chevron-down"></button>
        <button type="button" id="find-close" title="Close (Esc)" aria-label="Close find bar" data-icon="close"></button>
      </div>
    </div>
  </main>
  <aside id="side-panel" hidden></aside>
  <div id="sheet-backdrop"></div>
  <section id="tab-overview" role="dialog" aria-label="Tabs" hidden>
    <header><button type="button" class="overview-new" data-icon="plus">New tab</button><span class="overview-count"></span><button type="button" class="overview-done">Done</button></header>
    <div class="overview-grid"></div>
  </section>
  <div id="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
  <div id="print-preview" role="dialog" aria-label="Print preview" hidden>
    <header><span class="print-title"></span><button type="button" class="print-now primary">Print</button><button type="button" class="print-save">Save as PDF</button><button type="button" class="print-close" aria-label="Close" data-icon="close"></button></header>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
