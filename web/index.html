<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browser-lite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="chrome">
    <div id="tabs">
      <div id="tab-list"></div>
      <button id="new-tab" title="Neuer Tab">+</button>
    </div>
    <div id="toolbar">
      <button id="back" title="Zurück" disabled>&#8592;</button>
      <button id="forward" title="Vorwärts" disabled>&#8594;</button>
      <button id="reload" title="Neu laden">&#8635;</button>
      <form id="address-form">
        <span id="security" hidden></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Adresse eingeben">
      </form>
      <span id="status"></span>
      <button id="zoom" title="Zoom zurücksetzen" hidden></button>
      <button id="clear-data" title="Gespeicherte Daten löschen">&#128465;</button>
    </div>
    <div id="progress"></div>
  </header>
  <main id="viewport">
    <canvas id="screen" tabindex="0"></canvas>
    <textarea id="ime" aria-hidden="true" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div id="boot">Engine wird geladen...</div>
    <div id="find-bar" hidden>
      <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Auf Seite suchen">
      <span id="find-count"></span>
      <button id="find-prev" title="Vorheriger Treffer (Umschalt+Enter)">&#8963;</button>
      <button id="find-next" title="Nächster Treffer (Enter)">&#8964;</button>
      <button id="find-close" title="Schliessen (Esc)">&#215;</button>
    </div>
  </main>
  <div id="context-menu" role="menu" hidden></div>
  <div id="print-preview" role="dialog" aria-label="Druckvorschau" hidden>
    <header><span class="print-title"></span><button class="print-now primary">Drucken</button><a class="print-save">Als PDF speichern</a><button class="print-close" aria-label="Schliessen">×</button></header>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
