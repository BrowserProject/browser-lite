# browser-lite auf dem VPS: Caddy (HTTPS, Header) + Wisp-Relay.
# Vorbereitung: .env mit DOMAIN=... und RELAY_TOKEN=... anlegen (siehe README).
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN}
    # Nur intern erreichbar, Caddy leitet /wisp/ weiter
    expose:
      - "5001"

volumes:
  caddy_data:
  caddy_config:
