name: Deploy

# Wenn die CI auf main gruen ist (oder von Hand): Seite + Relay auf den VPS.
# Noetige Secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST      z.B. 203.0.113.10 oder browser.example.com
#   VPS_USER      SSH-Benutzer (braucht Docker-Rechte)
#   VPS_SSH_KEY   privater SSH-Schluessel (ed25519)
#   VPS_PATH      optional, Standard /opt/browser-lite
# Auf dem VPS muss in $VPS_PATH/.env DOMAIN und RELAY_TOKEN stehen (siehe relay/README.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI-Lauf, dessen Engine deployt werden soll (leer = letzter erfolgreicher auf main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::notice::VPS_HOST/VPS_USER/VPS_SSH_KEY nicht gesetzt, Deploy wird uebersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Engine-Artefakt holen
        if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v7
        with:
          name: engine
          path: engine-build
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Seite zusammenbauen
        if: steps.check.outputs.ok == 'true'
        run: tools/package-site.sh engine-build site
      - name: Auf den VPS kopieren und starten
        if: steps.check.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          target="${VPS_PATH:-/opt/browser-lite}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_cmd="ssh -i ~/.ssh/id_deploy -o BatchMode=yes"
          $ssh_cmd "$VPS_USER@$VPS_HOST" "mkdir -p '$target/www'"
          rsync -az --delete -e "$ssh_cmd" --exclude node_modules --exclude .env --exclude www relay/ "$VPS_USER@$VPS_HOST:$target/"
          rsync -az --delete -e "$ssh_cmd" site/ "$VPS_USER@$VPS_HOST:$target/www/"
          $ssh_cmd "$VPS_USER@$VPS_HOST" "cd '$target' && test -f .env && docker compose up -d --build"
