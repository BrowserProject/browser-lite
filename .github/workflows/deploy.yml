name: Deploy

# After a green CI on main (or by hand): build and test the images (tools/build-images.sh), push
# the demo image to ghcr.io and restart it on the server. The job deploy joins the tailnet for
# that (OIDC, ephemeral node with tag:browser-lite-ci) and logs in to the server through Tailscale
# SSH as deploy, whose login shell only restarts the demo (apps/demo/deploy/deploy-shell.sh).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a green push run of the CI on main (empty = latest green one)"
        required: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and test the images
    # Only pushes of this repository (a fork branch "main" must never deploy)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.push.outputs.image }}
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Find the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s success -L 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID: $RUN_ID"; exit 1; }
          # Also for an ID given by hand: only a green push run of the CI on main
          IFS=$'\t' read -r workflow event branch conclusion sha < <(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --json workflowName,event,headBranch,conclusion,headSha --jq '[.workflowName,.event,.headBranch,.conclusion,.headSha] | @tsv')
          if [ "$workflow/$event/$branch/$conclusion" != CI/push/main/success ] || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Run $RUN_ID is no green push run of the CI on main ($workflow, $event, $branch, $conclusion, $sha)"
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.run.outputs.sha }}
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the packages (the images copy packages/server/dist)
        run: |
          npm ci
          npm run build
      - name: Get the packaged engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine-dist
          path: build/engine-dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get the demo deployed so far (its engine stays, the new one gets deltas against it)
        run: |
          source versions.env
          mkdir -p build/previous
          if docker pull "$DEMO_IMAGE:main"; then
            id="$(docker create "$DEMO_IMAGE:main")"
            docker cp "$id:/app/site/." build/previous
            docker rm "$id"
          fi
      - name: Package the demo
        run: tools/package-demo.sh build/engine-dist build/demo build/previous
      - name: Build and test the images (headers, compression, relay, profile, SIGTERM)
        run: tools/build-images.sh build/demo "${{ steps.run.outputs.sha }}"
      - name: Push the demo image
        id: push
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          source versions.env
          docker tag "$DEMO_IMAGE:$SHA" "$DEMO_IMAGE:main"
          docker push "$DEMO_IMAGE:$SHA"
          docker push "$DEMO_IMAGE:main"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$DEMO_IMAGE:$SHA")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Restart on the server
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.image.outputs.sha }}
          sparse-checkout: versions.env
          sparse-checkout-cone-mode: false
      - name: Tailscale version from versions.env
        run: grep -E '^TAILSCALE_(VERSION|SHA256)=' versions.env >> "$GITHUB_ENV"
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:browser-lite-ci
          version: ${{ env.TAILSCALE_VERSION }}
          sha256sum: ${{ env.TAILSCALE_SHA256 }}
      - name: Restart
        env:
          TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ needs.image.outputs.sha }}
          ACTOR: ${{ github.actor }}
        # The token only on stdin: deploy-shell.sh fetches compose.yml with it and pulls the image
        run: printf '%s\n' "$TOKEN" | tailscale ssh deploy@browser-lite "$IMAGE $SHA $ACTOR"
