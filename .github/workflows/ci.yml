name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (Shell-Skripte, Pins)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x tools/*.sh deps/*.sh deps/recipes/*.sh
      - name: versions.env pruefen
        run: |
          # Nur KEY=VALUE oder Kommentare, keine Leerzeichen im Wert
          if grep -v -E '^(#.*|[A-Z0-9_]+=[^ ]+|)$' versions.env; then
            echo "versions.env hat ungueltige Zeilen (siehe oben)"; exit 1
          fi

  toolchain:
    name: Toolchain-Image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Image-Tag berechnen
        id: tag
        run: |
          source versions.env
          hash="$(find toolchain -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)"
          echo "image=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gibt es das Image schon?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Image bauen und pushen
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: EMSDK_VERSION=${{ steps.tag.outputs.emsdk }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  toolchain-check:
    name: Toolchain-Test (emcc + pthreads)
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: tools/check-toolchain.sh

  webkit-source:
    name: WebKit holen + Patches pruefen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: WebKit (gepinnt, sparse)
        run: tools/fetch-webkit.sh
      - name: Patches anwendbar?
        run: tools/apply-patches.sh --check

  deps:
    name: Dependencies nach WASM
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - name: Downloads aus dem Cache
        uses: actions/cache@v4
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: sysroot aus dem Cache
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: sysroot
          key: sysroot-${{ needs.toolchain.outputs.image }}-${{ hashFiles('deps/**') }}
          # Aelteren Stand nehmen, build-all.sh baut per Stamp nur was sich geaendert hat
          restore-keys: sysroot-${{ needs.toolchain.outputs.image }}-
      - name: Dependencies bauen
        run: deps/build-all.sh
      - name: Smoke-Test (alle Libs gelinkt, laeuft in node)
        run: deps/test.sh
      - name: sysroot fuer spaetere Jobs
        uses: actions/upload-artifact@v4
        with:
          name: sysroot
          path: sysroot
          retention-days: 7

  jsc:
    name: JavaScriptCore (CLoop) + Tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: sysroot holen
        uses: actions/download-artifact@v4
        with:
          name: sysroot
          path: sysroot
      - name: WebKit holen + Patches anwenden
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: ccache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-jsc-${{ needs.toolchain.outputs.image }}-
      - name: jsc bauen
        run: tools/build-jsc.sh
      - name: Tests (inkl. GC-Stresstest)
        run: tests/jsc/run.sh
      - name: jsc als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: jsc-wasm
          path: build/jsc/bin/jsc.*
          retention-days: 7
