name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A running run is never cancelled (a full WebKit build takes hours). New pushes wait,
# and only the newest waiting run starts afterwards.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (shell scripts, pins, rules from AGENTS.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: Style rules (ASCII, dashes, English, links, pins, actions)
        run: tools/check-style.sh

  js:
    name: JavaScript (packages, engine JS parts in node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and build the packages
        run: |
          npm ci
          npm run build
      - name: Server (relay, SSRF, limits, static files, tokens, profile store, CLI)
        run: npm test -w @browser-lite/server
      - name: Wisp transport against the server (token, echo, reconnect, dead connection probe)
        run: npm test -w @browser-lite/transport-wisp
      - name: Rewritten module against the original
        run: node tests/wasm/rewrite-test.mjs
      - name: WebAssembly API over the simulated bridge
        run: node tests/wasm/api-test.mjs
      - name: WebM muxer of MediaRecorder
        run: node tests/engine/recorder-test.mjs
      - name: HTTP cache cleanup
        run: node tests/engine/http-cache-test.mjs
      - name: Engine contract (engine/abi.json against the sources)
        run: node tests/contract/abi-test.mjs
      - name: Demo (type check and Vite build)
        run: |
          npx tsc --noEmit -p apps/demo
          npm run build -w @browser-lite/demo

  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      emsdk: ${{ steps.tag.outputs.emsdk }}
      image_emsdk: ${{ steps.tag.outputs.image_emsdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compute image tag
        id: tag
        run: |
          source versions.env
          # Files of the image and its pins from versions.env
          pins="$(grep -E '^(TOOLCHAIN_BASE_IMAGE|EMSDK_|MESON_)' versions.env)"
          hash="$( { find toolchain -type f ! -name README.md | sort | xargs sha256sum; echo "$pins"; } | sha256sum | cut -c1-12)"
          echo "image=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            echo "BASE_IMAGE=$TOOLCHAIN_BASE_IMAGE"
            grep -E '^(EMSDK_|MESON_)' versions.env
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "image_emsdk=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Does the image exist?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: toolchain
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: ${{ steps.tag.outputs.build_args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  toolchain-check:
    name: Toolchain test (emcc + pthreads)
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/check-toolchain.sh

  webkit-source:
    name: Fetch WebKit + check patches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: WebKit (pinned, sparse)
        run: tools/fetch-webkit.sh
      - name: Patches apply?
        run: tools/apply-patches.sh --check

  deps:
    name: Dependencies to WASM
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Downloads from cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: sysroot from cache
        id: sysroot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: sysroot
          key: sysroot-${{ needs.toolchain.outputs.image }}-${{ hashFiles('deps/**') }}
          # Take an older state, build-all.sh rebuilds only what changed (stamps)
          restore-keys: sysroot-${{ needs.toolchain.outputs.image }}-
      - name: Build dependencies
        run: deps/build-all.sh
      - name: Smoke test (all libs linked, runs in node)
        run: deps/test.sh
      - name: sysroot for later jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sysroot
          path: sysroot
          retention-days: 7

  jsc:
    name: JavaScriptCore (CLoop) + Tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 3G
      # The compiler is emcc from this emsdk. Without this ccache compares the mtime of emcc,
      # and every new toolchain image (same emsdk) would invalidate the whole cache.
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Get sysroot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sysroot
          path: sysroot
      - name: Fetch WebKit + apply patches
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-jsc-${{ needs.toolchain.outputs.image }}-
            ccache-jsc-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: Build jsc
        # Stop before the job limit so ccache is still saved; a rerun continues from it
        run: timeout 320m tools/build-jsc.sh
      - name: Save ccache (also after a timeout)
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Tests (including GC stress test)
        run: tests/jsc/run.sh
      - name: jsc as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jsc-wasm
          path: build/jsc/bin/jsc.*
          retention-days: 7

  engine:
    name: WebCore + engine (PORT=Wasm) + engine tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: write
    timeout-minutes: 355
    env:
      IMAGE: ${{ needs.toolchain.outputs.image }}
      # Like in job jsc: ccache stays valid as long as the emsdk stays the same
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Pushes that do not touch the engine sources reuse the last built engine
      - name: Engine from cache
        id: engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/webcore/bin/engine.*
          key: engine-${{ needs.toolchain.outputs.image }}-${{ hashFiles('engine/**/*.cpp', 'engine/**/*.h', 'engine/js/**', 'engine/engine.cmake', 'engine/patches/**', 'tools/env.sh', 'tools/build-webcore.sh', 'tools/wasm-build-id.py', 'tools/fetch-webkit.sh', 'tools/apply-patches.sh', 'tools/gen-angle-shim.py', 'versions.env', 'deps/**') }}
      - name: Make room (the WebCore build needs a lot)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull toolchain image
        run: docker pull "$IMAGE"
      - name: Get sysroot
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sysroot
          path: sysroot
      - name: Fetch WebKit + apply patches
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: Restore ccache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-engine-${{ needs.toolchain.outputs.image }}-
            ccache-engine-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: Build WebCore + engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        # Stop before the 6h limit so ccache is still saved; a rerun continues from it
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_JOBS=4 -e CCACHE_DIR=/src/build/ccache -e CCACHE_MAXSIZE=5G -e CCACHE_COMPILERCHECK \
            "$IMAGE" timeout 320m tools/build-webcore.sh
      - name: Save ccache (also after a timeout)
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
      # Caches are limited to 10 GB per repo: keep only the newest ccache, or the large ccache
      # entries push out the sysroot and download caches
      - name: Delete older ccache entries
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key ccache-engine- --sort created_at --order desc -L 100 --json id --jq '.[1:][].id' |
            while read -r id; do gh cache delete -R "$GITHUB_REPOSITORY" "$id" || true; done
      - name: Save engine to cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/webcore/bin/engine.*
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Render test (node)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" bash -c \
            'node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/basic.html build/basic.ppm 800 600 && node tests/engine/check-basic.mjs build/basic.ppm'
      - name: WebCrypto test (OpenSSL in WASM)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="CRYPTO done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/crypto.html build/crypto.ppm 200 200 | tee build/crypto.log
          grep -q "CRYPTO done=ok" build/crypto.log
      - name: Stack limit after VM trap (recursion after GC request)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="STACK done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/stack.html build/stack.ppm 200 200 | tee build/stack.log
          grep -q "STACK done=ok" build/stack.log
      - name: Limits (deep DOM, long strings, memory until the end)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="LIMITS done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/limits.html build/limits.ppm 200 200 | tee build/limits.log
          grep -q "LIMITS done=ok" build/limits.log
      - name: Watchdog (endless loop is stopped, the engine keeps running)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_SCRIPT_TIMEOUT=2 -e RENDER_WAIT_FOR="HANG done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/hang.html build/hang.ppm 200 200 | tee build/hang.log
          grep -q "HANG done=ok" build/hang.log
      - name: Features and host bridges (no __bl globals, disabled features missing)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_FEATURES= -e RENDER_URL="file:///test/?features=none" -e RENDER_WAIT_FOR="BRIDGES done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/bridges.html build/bridges-none.ppm 200 200 | tee build/bridges-none.log
          grep -q "BRIDGES done=ok" build/bridges-none.log
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_URL="file:///test/?features=all" -e RENDER_WAIT_FOR="BRIDGES done" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/bridges.html build/bridges-all.ppm 200 200 | tee build/bridges-all.log
          grep -q "BRIDGES done=ok" build/bridges-all.log
      - name: Error page (custom template, escaping, CSP, retry, close reasons)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            node tests/engine/error-page-test.mjs build/webcore/bin/engine.js
      - name: GC stress test in the engine (GC very often, only on an empty stack)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e JSC_slowPathAllocsBetweenGCs=10 "$IMAGE" \
            node tests/engine/gc-test.mjs build/webcore/bin/engine.js
      - name: Engine as artifact
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engine
          path: |
            build/webcore/bin/engine.js
            build/webcore/bin/engine.wasm
            build/webcore/bin/engine.data
          retention-days: 14
      - name: Render image as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: render-test
          path: build/basic.ppm
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Chromium + relay + engine)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine
          path: build/webcore/bin
      - name: Install (packages + Playwright Chromium)
        id: setup
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      # Every test runs even if an earlier one failed (the job stays red then)
      - name: Network
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node network-test.mjs
      - name: Input (typing, click, download, upload, popup, select, color, date, scrolling)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node input-test.mjs
      - name: Storage (cookie, localStorage, IndexedDB, OPFS after reload)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node storage-test.mjs
      - name: Profile (second device, takeover, reset, catch up at start, without server)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node profile-test.mjs
      - name: Settings (dialog, device, JavaScript and images off, session after restart)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node settings-test.mjs
      - name: Audio (Web Audio, decodeAudioData, sound in the AudioWorklet)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node audio-test.mjs
      - name: Media (<video>/<audio> through service worker and engine)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node media-test.mjs
      - name: WebGL (WebGL 1 and 2 through the WebGL of the host browser)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webgl-test.mjs
      - name: Compositing (layers on the GPU, animation, filters, scrolling)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node compositing-test.mjs
      - name: Paint worklet (CSS.paintWorklet, paint() in CSS, module loading)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node paintworklet-test.mjs
      - name: Pinch (pinch zoom in the compositor thread, visualViewport)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node pinch-test.mjs
      - name: Service worker (register, intercept fetch, SharedWorker)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node serviceworker-test.mjs
      - name: WebCodecs (VideoFrame, VP8 and Opus encode/decode, worker)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webcodecs-test.mjs
      - name: MediaStream (camera, microphone, screen through the host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node mediastream-test.mjs
      - name: WebRTC (RTCPeerConnection, DataChannel, connection to Chromium)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webrtc-test.mjs
      - name: Drag and drop (in the page, files and text from the host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node dragdrop-test.mjs
      - name: Clipboard (paste with HTML and image, copy with HTML, double click)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node clipboard-test.mjs
      - name: WebAssembly (page modules in the WASM engine of the browser)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node wasm-test.mjs
      - name: HTTP cache (max-age, ETag/304, no-store after reload)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node cache-test.mjs
      - name: Devices (selection, touch, color scheme, geolocation, notifications)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node devices-test.mjs
      - name: UI (history, bookmarks, suggestions, session)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node ui-test.mjs
      - name: Background tabs (hidden, timers, sound, memory pressure, hang after input)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node background-test.mjs
      - name: Soak (many pages and tabs, no memory held afterwards)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node soak-test.mjs
      - name: Parity with Chromium (web APIs, JS, CSS; red only on regression)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && PARITY_REPORT="$GITHUB_STEP_SUMMARY" node parity-test.mjs
      - name: Screenshots as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-screenshots
          path: build/e2e-*.png
          if-no-files-found: ignore

  compat:
    name: Compatibility (real sites, informational)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Depends on foreign servers, so a failure here does not block
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine
          path: build/webcore/bin
      - name: Install (packages + Playwright Chromium)
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Load the sites from tests/e2e/sites.txt
        run: cd tests/e2e && SITE_WAIT=5000 SITE_DEBUG=1 SITE_TIMEOUT=180000 node site-test.mjs $(grep -v "^#" sites.txt)
      - name: Screenshots as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compat
          path: build/sites/
          if-no-files-found: ignore
