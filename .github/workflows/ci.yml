name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A running run is never cancelled (a full WebKit build takes hours). New pushes wait,
# and only the newest waiting run starts afterwards.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (shell scripts, pins, rules from AGENTS.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: Style rules (ASCII, dashes, English, links, pins, actions)
        run: tools/check-style.sh

  js:
    name: JavaScript (packages, engine JS parts in node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and build the packages
        run: |
          npm ci
          npm run build
      - name: Checks (style, Biome, types of packages, demo and examples, contract tests)
        run: npm run check
      - name: Unit tests of the packages and the engine JS parts in node (npm test)
        run: npm test
      - name: Demo (Vite build)
        run: npm run build -w @browser-lite/demo

  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      emsdk: ${{ steps.tag.outputs.emsdk }}
      image_emsdk: ${{ steps.tag.outputs.image_emsdk }}
      webkit_pins: ${{ steps.webkit-pins.outputs.hash }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compute image tag
        id: tag
        run: |
          source versions.env
          # Files of the image and its pins from versions.env
          pins="$(grep -E '^(TOOLCHAIN_BASE_IMAGE|EMSDK_|MESON_)' versions.env)"
          hash="$( { find toolchain -type f ! -name README.md | sort | xargs sha256sum; echo "$pins"; } | sha256sum | cut -c1-12)"
          echo "image=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            echo "BASE_IMAGE=$TOOLCHAIN_BASE_IMAGE"
            grep -E '^(EMSDK_|MESON_)' versions.env
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "image_emsdk=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
      # Only the pins of versions.env that the jsc and engine builds read; Emscripten and the
      # toolchain are in the image tag. Other pins (Node, runner) do not rebuild WebKit.
      - name: Pins of the WebKit builds
        id: webkit-pins
        run: echo "hash=$(grep -E '^WEBKIT_' versions.env | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Does the image exist?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: toolchain
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: ${{ steps.tag.outputs.build_args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  toolchain-check:
    name: Toolchain test (emcc + pthreads)
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/check-toolchain.sh

  webkit-source:
    name: Fetch WebKit + check patches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: WebKit (pinned, sparse)
        run: tools/fetch-webkit.sh
      - name: Patches apply?
        run: tools/apply-patches.sh --check

  deps:
    name: Dependencies to WASM
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Downloads from cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: sysroot from cache
        id: sysroot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: sysroot
          key: sysroot-${{ needs.toolchain.outputs.image }}-${{ hashFiles('deps/**') }}
          # Take an older state, build-all.sh rebuilds only what changed (stamps)
          restore-keys: sysroot-${{ needs.toolchain.outputs.image }}-
      - name: Build dependencies
        run: deps/build-all.sh
      - name: Smoke test (all libs linked, runs in node)
        run: deps/test.sh
      - name: sysroot for later jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sysroot
          path: sysroot
          retention-days: 7

  jsc:
    name: JavaScriptCore (CLoop) + Tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 3G
      # The compiler is emcc from this emsdk. Without this ccache compares the mtime of emcc,
      # and every new toolchain image (same emsdk) would invalidate the whole cache.
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Pushes that do not touch the JSC sources reuse the last built jsc shell
      - name: jsc from cache
        id: jsc-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/jsc/bin/jsc.*
          key: jsc-${{ needs.toolchain.outputs.image }}-${{ needs.toolchain.outputs.webkit_pins }}-${{ hashFiles('engine/patches/**', 'tools/env.sh', 'tools/build-jsc.sh', 'tools/fetch-webkit.sh', 'tools/apply-patches.sh', 'deps/**') }}
      - name: Get sysroot
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sysroot
          path: sysroot
      - name: Fetch WebKit + apply patches
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: Restore ccache
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-jsc-${{ needs.toolchain.outputs.image }}-
            ccache-jsc-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: Build jsc
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        # Stop before the job limit so ccache is still saved; a rerun continues from it
        run: timeout 320m tools/build-jsc.sh
      - name: Save ccache (also after a timeout)
        if: always() && steps.jsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Save jsc to cache
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/jsc/bin/jsc.*
          key: ${{ steps.jsc-cache.outputs.cache-primary-key }}
      - name: Tests (including GC stress test)
        run: tests/jsc/run.sh
      - name: jsc as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jsc-wasm
          path: build/jsc/bin/jsc.*
          retention-days: 7

  engine:
    name: WebCore + engine (PORT=Wasm) + engine tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 355
    env:
      IMAGE: ${{ needs.toolchain.outputs.image }}
      # Like in job jsc: ccache stays valid as long as the emsdk stays the same
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Pushes that do not touch the engine sources reuse the last built engine
      - name: Engine from cache
        id: engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/webcore/bin/engine.*
            build/webcore/bin/wtf-tests.*
            build/webcore/bin/lazy
          key: engine-${{ needs.toolchain.outputs.image }}-${{ needs.toolchain.outputs.webkit_pins }}-${{ hashFiles('engine/**/*.cpp', 'engine/**/*.h', 'engine/js/**', 'engine/engine.cmake', 'engine/*.txt', 'engine/patches/**', 'tests/engine/*.cpp', 'tools/env.sh', 'tools/build-webcore.sh', 'tools/fetch-webkit.sh', 'tools/apply-patches.sh', 'tools/icu-data.mjs', 'tools/split-engine.mjs', 'tools/hot-functions-file.mjs', 'tools/wasm-binary.mjs', 'deps/**') }}
      - name: Make room (the WebCore build needs a lot)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull toolchain image
        run: docker pull "$IMAGE"
      - name: Get sysroot
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sysroot
          path: sysroot
      - name: Fetch WebKit + apply patches
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: Restore ccache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-engine-${{ needs.toolchain.outputs.image }}-
            ccache-engine-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: Build WebCore + engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        # Stop before the 6h limit so ccache is still saved; a rerun continues from it
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_JOBS=4 -e CCACHE_DIR=/src/build/ccache -e CCACHE_MAXSIZE=5G -e CCACHE_COMPILERCHECK \
            "$IMAGE" timeout 320m tools/build-webcore.sh
      - name: Save ccache (also after a timeout)
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Save engine to cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/webcore/bin/engine.*
            build/webcore/bin/wtf-tests.*
            build/webcore/bin/lazy
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Engine tests in node (pages, error page, GC stress, WTF)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_ACTIONS "$IMAGE" node tests/run.mjs engine
      # The license texts come from the dependency archives (tools/licenses.txt)
      - name: Downloads from cache (license texts)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: Package the engine (content hash, .br/.gz, manifest.json, THIRD_PARTY_NOTICES.txt)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL "$IMAGE" \
            tools/package-engine.sh build/webcore/bin build/engine-dist
      - name: Engine as artifact
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engine
          path: |
            build/webcore/bin/engine.js
            build/webcore/bin/engine.wasm
            build/webcore/bin/engine.deferred.wasm
            build/webcore/bin/engine.full.wasm
            build/webcore/bin/engine.data
            build/webcore/bin/lazy
          retention-days: 14
      - name: Packaged engine as artifact (deploy, release)
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engine-dist
          path: build/engine-dist
          retention-days: 14
      - name: Render image as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: render-test
          path: build/engine-pages/basic.ppm
          if-no-files-found: ignore

  # Caches are limited to 10 GB per repo: keep only the newest ccache of jsc and engine, or the
  # large ccache entries push out the sysroot and download caches
  ccache-prune:
    name: Delete older ccache entries
    needs: [jsc, engine]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for prefix in ccache-jsc- ccache-engine-; do
            gh cache list -R "$GITHUB_REPOSITORY" --key "$prefix" --sort created_at --order desc -L 100 --json id --jq '.[1:][].id' |
              while read -r id; do gh cache delete -R "$GITHUB_REPOSITORY" "$id" || true; done
          done

  e2e-core:
    name: End-to-end core (Chromium + core test host page + relay + engine)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine
          path: build/webcore/bin
      - name: Install (packages + Playwright Chromium)
        id: install
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      # Every test runs even if an earlier one failed (the job stays red then)
      - name: Core suites (tests/core, one after the other)
        run: PARITY_REPORT="$GITHUB_STEP_SUMMARY" node tests/run.mjs core
      - name: DOM tests of the packages (packages/*/test/browser.mjs)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/run.mjs packages
      - name: Examples (tests/examples)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/run.mjs examples --engine=build/webcore/bin
      - name: Screenshots as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-core-screenshots
          path: build/e2e-*.png
          if-no-files-found: ignore

  e2e-demo:
    name: End-to-end demo (Chromium + packaged demo + relay + engine)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine
          path: build/webcore/bin
      - name: Install (packages + Playwright Chromium)
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Package the demo once (tools/package-demo.sh)
        run: tools/package-demo.sh build/webcore/bin build/demo
      - name: Demo suites (tests/demo against the packaged demo)
        run: E2E_SITE_DIR=build/demo node tests/run.mjs demo
      - name: Screenshots as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-demo-screenshots
          path: build/e2e-*.png
          if-no-files-found: ignore

  compat:
    name: Compatibility (real sites, informational)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Depends on foreign servers, so a failure here does not block
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Node version from versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: engine
          path: build/webcore/bin
      - name: Install (packages + Playwright Chromium)
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Load the sites of tests/compat/sites.txt
        run: SITE_WAIT=5000 SITE_DEBUG=1 SITE_TIMEOUT=180000 node tests/run.mjs compat
      - name: Screenshots as artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compat
          path: build/sites/
          if-no-files-found: ignore
