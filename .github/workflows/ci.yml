name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Ein laufender Lauf wird nicht abgebrochen (ein voller WebKit-Build dauert
# Stunden). Neue Pushes warten, und nur der neueste wartende Lauf startet danach.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (Shell-Skripte, Pins)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x tools/*.sh deps/*.sh deps/recipes/*.sh
      - name: versions.env pruefen
        run: |
          # Nur KEY=VALUE oder Kommentare, keine Leerzeichen im Wert
          if grep -v -E '^(#.*|[A-Z0-9_]+=[^ ]+|)$' versions.env; then
            echo "versions.env hat ungueltige Zeilen (siehe oben)"; exit 1
          fi

  relay:
    name: Relay + Wisp-Client Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Relay installieren
        working-directory: relay
        run: npm ci --no-audit --no-fund
      - name: Test (Token, 2 MB Echo ueber Wisp)
        run: node tests/relay/relay-test.mjs

  toolchain:
    name: Toolchain-Image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Image-Tag berechnen
        id: tag
        run: |
          source versions.env
          hash="$(find toolchain -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)"
          echo "image=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gibt es das Image schon?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Image bauen und pushen
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: EMSDK_VERSION=${{ steps.tag.outputs.emsdk }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  toolchain-check:
    name: Toolchain-Test (emcc + pthreads)
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: tools/check-toolchain.sh

  webkit-source:
    name: WebKit holen + Patches pruefen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: WebKit (gepinnt, sparse)
        run: tools/fetch-webkit.sh
      - name: Patches anwendbar?
        run: tools/apply-patches.sh --check

  deps:
    name: Dependencies nach WASM
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - name: Downloads aus dem Cache
        uses: actions/cache@v5
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: sysroot aus dem Cache
        id: sysroot-cache
        uses: actions/cache@v5
        with:
          path: sysroot
          key: sysroot-${{ needs.toolchain.outputs.image }}-${{ hashFiles('deps/**') }}
          # Aelteren Stand nehmen, build-all.sh baut per Stamp nur was sich geaendert hat
          restore-keys: sysroot-${{ needs.toolchain.outputs.image }}-
      - name: Dependencies bauen
        run: deps/build-all.sh
      - name: Smoke-Test (alle Libs gelinkt, laeuft in node)
        run: deps/test.sh
      - name: sysroot fuer spaetere Jobs
        uses: actions/upload-artifact@v6
        with:
          name: sysroot
          path: sysroot
          retention-days: 7

  jsc:
    name: JavaScriptCore (CLoop) + Tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: sysroot holen
        uses: actions/download-artifact@v7
        with:
          name: sysroot
          path: sysroot
      - name: WebKit holen + Patches anwenden
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: ccache
        uses: actions/cache@v5
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-jsc-${{ needs.toolchain.outputs.image }}-
      - name: jsc bauen
        run: tools/build-jsc.sh
      - name: Tests (inkl. GC-Stresstest)
        run: tests/jsc/run.sh
      - name: jsc als Artefakt
        uses: actions/upload-artifact@v6
        with:
          name: jsc-wasm
          path: build/jsc/bin/jsc.*
          retention-days: 7

  engine:
    name: WebCore + Engine (PORT=Wasm) + Render-Test
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - name: Platz schaffen (WebCore-Build braucht viel)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1
      - uses: actions/checkout@v5
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain-Image holen
        run: docker pull "$IMAGE"
      - name: sysroot holen
        uses: actions/download-artifact@v7
        with:
          name: sysroot
          path: sysroot
      - name: WebKit holen + Patches anwenden
        run: |
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: ccache holen
        uses: actions/cache/restore@v5
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-engine-${{ needs.toolchain.outputs.image }}-
      - name: WebCore + Engine bauen
        # Vor dem 6h-Limit selber abbrechen, damit ccache noch gespeichert wird.
        # Der naechste Lauf macht dann mit dem Cache weiter.
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_JOBS=4 -e CCACHE_DIR=/src/build/ccache -e CCACHE_MAXSIZE=5G \
            "$IMAGE" timeout 320m tools/build-webcore.sh
      - name: ccache speichern (auch bei Abbruch)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
      - name: Render-Test (node)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" bash -c \
            'node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/basic.html build/basic.ppm 800 600 && node tests/engine/check-basic.mjs build/basic.ppm'
      - name: GC-Stresstest in der Engine (GC sehr oft, nur auf leerem Stack)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e JSC_slowPathAllocsBetweenGCs=10 "$IMAGE" \
            node tests/engine/gc-test.mjs build/webcore/bin/engine.js
      - name: Engine als Artefakt
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: engine
          path: |
            build/webcore/bin/engine.js
            build/webcore/bin/engine.wasm
            build/webcore/bin/engine.data
          retention-days: 14
      - name: Render-Bild als Artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-test
          path: build/basic.ppm
          if-no-files-found: ignore

  e2e:
    name: End-to-End (Chromium + Relay + Engine)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Engine holen
        uses: actions/download-artifact@v7
        with:
          name: engine
          path: build/webcore/bin
      - name: Relay + Playwright installieren
        run: |
          (cd relay && npm ci)
          (cd tests/e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Netzwerk-Test
        run: cd tests/e2e && node network-test.mjs
      - name: Eingabe-Test (Tippen, Klick, Download, Upload, Popup, Scrollen)
        run: cd tests/e2e && node input-test.mjs
      - name: Speicher-Test (Cookie, localStorage, IndexedDB nach Neuladen)
        run: cd tests/e2e && node storage-test.mjs
      - name: Echte Seiten (Internet, nur zur Info)
        # Haengt von fremden Servern ab, darum blockiert ein Fehler hier nicht.
        continue-on-error: true
        run: |
          cd tests/e2e && SITE_WAIT=5000 node site-test.mjs \
            https://example.com/ https://de.wikipedia.org/wiki/Schweiz https://news.ycombinator.com/ \
            https://www.srf.ch/ https://www.20min.ch/ https://github.com/ https://www.google.com/ \
            https://html.duckduckgo.com/html/?q=webkit https://developer.mozilla.org/de/ \
            https://stackoverflow.com/questions https://old.reddit.com/ https://www.bbc.com/news \
            https://www.openstreetmap.org/ https://www.youtube.com/
      - name: Screenshots als Artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: |
            build/e2e-network.png
            build/e2e-input.png
            build/sites/
          if-no-files-found: ignore
