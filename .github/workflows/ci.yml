name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Ein laufender Lauf wird nicht abgebrochen (ein voller WebKit-Build dauert
# Stunden). Neue Pushes warten, und nur der neueste wartende Lauf startet danach.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (Shell-Skripte, Pins)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: versions.env pruefen
        run: |
          # Nur KEY=VALUE oder Kommentare, keine Leerzeichen im Wert
          if grep -v -E '^(#.*|[A-Z0-9_]+=[^ ]+|)$' versions.env; then
            echo "versions.env hat ungueltige Zeilen (siehe oben)"; exit 1
          fi
          source versions.env
          [[ "$NODE_IMAGE" == "node:$NODE_VERSION-"* ]] || { echo "NODE_IMAGE passt nicht zu NODE_VERSION"; exit 1; }

  relay:
    name: Relay + Wisp-Client Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Node-Version aus versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Relay installieren
        working-directory: relay
        run: npm ci --no-audit --no-fund
      - name: Test (Token, Echo, Reconnect, SSRF-Sperre, statische Dateien)
        run: node tests/relay/relay-test.mjs

  wasm-js:
    name: JS-Teile der Engine in node (WebAssembly der Seiten, MediaRecorder)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Node-Version aus versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Umgeschriebenes Modul gegen das Original
        run: node tests/wasm/rewrite-test.mjs
      - name: WebAssembly-API ueber die nachgebaute Bruecke
        run: node tests/wasm/api-test.mjs
      - name: WebM-Muxer von MediaRecorder
        run: node tests/engine/recorder-test.mjs
      - name: Aufraeumen des HTTP-Cache
        run: node tests/engine/http-cache-test.mjs

  toolchain:
    name: Toolchain-Image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      emsdk: ${{ steps.tag.outputs.emsdk }}
      image_emsdk: ${{ steps.tag.outputs.image_emsdk }}
    steps:
      - uses: actions/checkout@v5
      - name: Image-Tag berechnen
        id: tag
        run: |
          source versions.env
          hash="$(find toolchain -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)"
          echo "image=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          echo "image_emsdk=${TOOLCHAIN_IMAGE}:emsdk-${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "emsdk=${EMSDK_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gibt es das Image schon?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Image bauen und pushen
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: EMSDK_VERSION=${{ steps.tag.outputs.emsdk }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  toolchain-check:
    name: Toolchain-Test (emcc + pthreads)
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: tools/check-toolchain.sh

  webkit-source:
    name: WebKit holen + Patches pruefen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: WebKit (gepinnt, sparse)
        run: tools/fetch-webkit.sh
      - name: Patches anwendbar?
        run: tools/apply-patches.sh --check

  deps:
    name: Dependencies nach WASM
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - name: Downloads aus dem Cache
        uses: actions/cache@v5
        with:
          path: third_party/downloads
          key: downloads-${{ hashFiles('deps/sources.txt') }}
          restore-keys: downloads-
      - name: sysroot aus dem Cache
        id: sysroot-cache
        uses: actions/cache@v5
        with:
          path: sysroot
          key: sysroot-${{ needs.toolchain.outputs.image }}-${{ hashFiles('deps/**') }}
          # Aelteren Stand nehmen, build-all.sh baut per Stamp nur was sich geaendert hat
          restore-keys: sysroot-${{ needs.toolchain.outputs.image }}-
      - name: Dependencies bauen
        run: deps/build-all.sh
      - name: Smoke-Test (alle Libs gelinkt, laeuft in node)
        run: deps/test.sh
      - name: sysroot fuer spaetere Jobs
        uses: actions/upload-artifact@v6
        with:
          name: sysroot
          path: sysroot
          retention-days: 7

  jsc:
    name: JavaScriptCore (CLoop) + Tests
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BL_JOBS: 4
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 3G
      # Compiler ist emcc aus diesem emsdk. Ohne das vergleicht ccache das mtime von emcc,
      # und jedes neue Toolchain-Image (gleiches emsdk) macht den ganzen Cache ungueltig.
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - uses: actions/checkout@v5
      - name: sysroot holen
        uses: actions/download-artifact@v7
        with:
          name: sysroot
          path: sysroot
      - name: WebKit holen + Patches anwenden
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: ccache
        uses: actions/cache@v5
        with:
          path: build/ccache
          key: ccache-jsc-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
          restore-keys: |
            ccache-jsc-${{ needs.toolchain.outputs.image }}-
            ccache-jsc-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: jsc bauen
        run: tools/build-jsc.sh
      - name: Tests (inkl. GC-Stresstest)
        run: tests/jsc/run.sh
      - name: jsc als Artefakt
        uses: actions/upload-artifact@v6
        with:
          name: jsc-wasm
          path: build/jsc/bin/jsc.*
          retention-days: 7

  engine:
    name: WebCore + Engine (PORT=Wasm) + Render-Test
    needs: [toolchain, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      IMAGE: ${{ needs.toolchain.outputs.image }}
      # Wie im Job jsc: ccache bleibt gueltig, solange das emsdk gleich bleibt
      CCACHE_COMPILERCHECK: string:emsdk-${{ needs.toolchain.outputs.emsdk }}
    steps:
      - name: Platz schaffen (WebCore-Build braucht viel)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1
      - uses: actions/checkout@v5
      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain-Image holen
        run: docker pull "$IMAGE"
      - name: sysroot holen
        uses: actions/download-artifact@v7
        with:
          name: sysroot
          path: sysroot
      - name: WebKit holen + Patches anwenden
        run: |
          tools/fetch-webkit.sh
          tools/apply-patches.sh
      - name: ccache holen
        uses: actions/cache/restore@v5
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-${{ needs.toolchain.outputs.image }}-
            ccache-engine-${{ needs.toolchain.outputs.image_emsdk }}-
      - name: WebCore + Engine bauen
        # Vor dem 6h-Limit selber abbrechen, damit ccache noch gespeichert wird.
        # Der naechste Lauf macht dann mit dem Cache weiter.
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_JOBS=4 -e CCACHE_DIR=/src/build/ccache -e CCACHE_MAXSIZE=5G -e CCACHE_COMPILERCHECK \
            "$IMAGE" timeout 320m tools/build-webcore.sh
      - name: ccache speichern (auch bei Abbruch)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build/ccache
          key: ccache-engine-${{ needs.toolchain.outputs.image }}-${{ github.sha }}
      - name: Render-Test (node)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" bash -c \
            'node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/basic.html build/basic.ppm 800 600 && node tests/engine/check-basic.mjs build/basic.ppm'
      - name: WebCrypto-Test (OpenSSL im WASM)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="CRYPTO fertig" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/crypto.html build/crypto.ppm 200 200 | tee build/crypto.log
          grep -q "CRYPTO fertig=ok" build/crypto.log
      - name: Stack-Grenze nach VM-Trap (Rekursion nach GC-Anforderung)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="STACK fertig" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/stack.html build/stack.ppm 200 200 | tee build/stack.log
          grep -q "STACK fertig=ok" build/stack.log
      - name: Grenzen (tiefes DOM, lange Strings, Speicher bis zum Ende)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RENDER_WAIT_FOR="LIMITS fertig" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/limits.html build/limits.ppm 200 200 | tee build/limits.log
          grep -q "LIMITS fertig=ok" build/limits.log
      - name: Watchdog (Endlosschleife wird abgebrochen, die Engine laeuft weiter)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BL_SCRIPT_TIMEOUT=2 -e RENDER_WAIT_FOR="HANG fertig" "$IMAGE" \
            node tests/engine/render-test.mjs build/webcore/bin/engine.js tests/engine/hang.html build/hang.ppm 200 200 | tee build/hang.log
          grep -q "HANG fertig=ok" build/hang.log
      - name: GC-Stresstest in der Engine (GC sehr oft, nur auf leerem Stack)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e JSC_slowPathAllocsBetweenGCs=10 "$IMAGE" \
            node tests/engine/gc-test.mjs build/webcore/bin/engine.js
      - name: Engine als Artefakt
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: engine
          path: |
            build/webcore/bin/engine.js
            build/webcore/bin/engine.wasm
            build/webcore/bin/engine.data
          retention-days: 14
      - name: Render-Bild als Artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-test
          path: build/basic.ppm
          if-no-files-found: ignore

  e2e:
    name: End-to-End (Chromium + Relay + Engine)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Node-Version aus versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Engine holen
        uses: actions/download-artifact@v7
        with:
          name: engine
          path: build/webcore/bin
      - name: Relay + Playwright installieren
        id: setup
        run: |
          (cd relay && npm ci)
          (cd tests/e2e && npm ci && npx playwright install --with-deps chromium)
      # Jeder Test laeuft, auch wenn ein frueherer rot war (der Job bleibt dann rot)
      - name: Netzwerk-Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node network-test.mjs
      - name: Eingabe-Test (Tippen, Klick, Download, Upload, Popup, select, Farbe, Datum, Scrollen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node input-test.mjs
      - name: Speicher-Test (Cookie, localStorage, IndexedDB, OPFS nach Neuladen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node storage-test.mjs
      - name: Audio-Test (Web Audio, decodeAudioData, Ton im AudioWorklet)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node audio-test.mjs
      - name: Media-Test (<video>/<audio> ueber Service Worker und Engine)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node media-test.mjs
      - name: WebGL-Test (WebGL 1 und 2 ueber WebGL des Host-Browsers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webgl-test.mjs
      - name: Compositing-Test (Ebenen auf der GPU, Animation, Filter, Scrollen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node compositing-test.mjs
      - name: Paint-Worklet-Test (CSS.paintWorklet, paint() in CSS, Modul laden)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node paintworklet-test.mjs
      - name: Pinch-Test (Pinch-Zoom im Compositor-Thread, visualViewport)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node pinch-test.mjs
      - name: Service-Worker-Test (Registrieren, Fetch abfangen, SharedWorker)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node serviceworker-test.mjs
      - name: WebCodecs-Test (VideoFrame, VP8 und Opus kodieren/dekodieren, Worker)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webcodecs-test.mjs
      - name: MediaStream-Test (Kamera, Mikrofon, Bildschirm ueber den Host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node mediastream-test.mjs
      - name: WebRTC-Test (RTCPeerConnection, DataChannel, Verbindung zu Chromium)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node webrtc-test.mjs
      - name: Drag-&-Drop-Test (in der Seite, Dateien und Text aus dem Host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node dragdrop-test.mjs
      - name: Zwischenablage-Test (Einfuegen mit HTML und Bild, Kopieren mit HTML, Doppelklick)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node clipboard-test.mjs
      - name: WebAssembly-Test (Module der Seiten in der WASM-Engine des Browsers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node wasm-test.mjs
      - name: HTTP-Cache-Test (max-age, ETag/304, no-store nach Neuladen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node cache-test.mjs
      - name: Geraete-Test (Markieren, Touch, Farbschema, Standort, Benachrichtigungen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node devices-test.mjs
      - name: Oberflaeche-Test (Verlauf, Lesezeichen, Vorschlaege, Sitzung)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && node ui-test.mjs
      - name: Messlatte gegen Chromium (Web-APIs, JS, CSS; rot nur bei Rueckschritt)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd tests/e2e && PARITY_REPORT="$GITHUB_STEP_SUMMARY" node parity-test.mjs
      - name: Screenshots als Artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: build/e2e-*.png
          if-no-files-found: ignore

  kompatibilitaet:
    name: Kompatibilitaet (echte Seiten, nur zur Info)
    needs: [engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Haengt von fremden Servern ab, darum blockiert ein Fehler hier nicht.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Node-Version aus versions.env
        run: grep '^NODE_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Engine holen
        uses: actions/download-artifact@v7
        with:
          name: engine
          path: build/webcore/bin
      - name: Relay + Playwright installieren
        run: |
          (cd relay && npm ci)
          (cd tests/e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Seiten aus tests/e2e/sites.txt laden
        run: cd tests/e2e && SITE_WAIT=5000 SITE_DEBUG=1 SITE_TIMEOUT=180000 node site-test.mjs $(grep -v "^#" sites.txt)
      - name: Screenshots als Artefakt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kompatibilitaet
          path: build/sites/
          if-no-files-found: ignore
